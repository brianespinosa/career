# NOTE: This is a local composite action and requires the repository to have
# already been checked out before it is called (e.g. actions/checkout@v6.0.2).
#
# NOTE: pnpm/action-setup installs pnpm (reading the `packageManager` field
# from package.json) before actions/setup-node runs, so setup-node's built-in
# `cache: pnpm` option can resolve the pnpm store path directly. See
# docs/adr/013-pnpm-migration.md.

name: Setup
description: Install pnpm and dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6.2.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
